<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square with ScaleSmart branding colors -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#gradient)" />
  
  <!-- Sleek bold checking checkmark to symbolize the Ticketing / Execution System -->
